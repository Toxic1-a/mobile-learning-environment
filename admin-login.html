  <script>
    window.pageId = 'admin-login';
    
    // Initialize admin login system
    document.addEventListener('DOMContentLoaded', function() {
      initAdminLogin();
    });
    
    function initAdminLogin() {
      const adminForm = document.getElementById('adminLoginForm');
      const errorMessage = document.getElementById('errorMessage');
      
      // Admin login
      if (adminForm) {
        adminForm.addEventListener('submit', function(e) {
          e.preventDefault();
          handleAdminLogin();
        });
      }
      
      function handleAdminLogin() {
        const username = document.getElementById('adminUsername').value.trim();
        const password = document.getElementById('adminPassword').value.trim();
        const rememberMe = document.getElementById('adminRememberMe').checked;
        
        if (!username || !password) {
          showError('يرجى ملء جميع الحقول المطلوبة');
          return;
        }
        
        // Check admin credentials
        if (username === 'admin' && password === 'rasha123') {
          // Store admin session
          const adminData = {
            username: username,
            loginTime: new Date().toLocaleString('ar-SA'),
            userType: 'admin',
            rememberMe: rememberMe
          };
          
          localStorage.setItem('currentUser', JSON.stringify(adminData));
          localStorage.setItem('userType', 'admin');
          
          // Show success message
          showSuccessToast('تم تسجيل الدخول بنجاح');
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          showError('❌ اسم المستخدم أو كلمة المرور غير صحيحة');
        }
      }
      
      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        errorMessage.style.animation = 'shake 0.5s ease-in-out';
      }
      
      function hideError() {
        errorMessage.style.display = 'none';
      }
      
      function showSuccessToast(message) {
        // Create toast element
        const toast = document.createElement('div');
        toast.className = 'toast show position-fixed top-0 end-0 m-3';
        toast.style.zIndex = '9999';
        toast.innerHTML = `
          <div class="toast-header bg-success text-white">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong class="me-auto">نجح</strong>
            <button type="button" class="btn-close btn-close-white" onclick="this.parentElement.parentElement.remove()"></button>
          </div>
          <div class="toast-body">
            ${message}
          </div>
        `;
        
        document.body.appendChild(toast);
        
        // Auto remove after 3 seconds
        setTimeout(() => {
          toast.remove();
        }, 3000);
      }
      
      // Hide error when user starts typing
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        input.addEventListener('input', hideError);
      });
    }

    // نظام تسجيل دخول الإدارة
    function adminLogin() {
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value.trim();

      if (!username || !password) {
        alert('يرجى إدخال اسم المستخدم وكلمة المرور');
        return;
      }

      // بيانات الإدارة (في التطبيق الحقيقي ستكون من قاعدة البيانات)
      const adminCredentials = {
        'admin': ['admin123', 'rasha123'],      // كلمات مرور متعددة للـ admin
        'مدير': ['admin123', 'rasha123'],      // كلمات مرور متعددة للمدير
        'administrator': ['admin123', 'rasha123'],
        'rasha': ['rasha123', 'admin123'],     // حساب إضافي باسم rasha
        'رشا': ['rasha123', 'admin123']        // حساب إضافي بالعربية
      };

      // التحقق من اسم المستخدم وكلمة المرور
      if (adminCredentials[username] && adminCredentials[username].includes(password)) {
        // تسجيل دخول ناجح
        const adminUser = {
          username: username,
          loginTime: new Date().toISOString()
        };

        // حفظ البيانات في localStorage
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminUser', JSON.stringify(adminUser));
        
        // إضافة timestamp للتحقق من صحة الجلسة
        localStorage.setItem('adminLoginTime', new Date().getTime().toString());


        alert('تم تسجيل الدخول بنجاح!');
        
        // توجيه للوحة المتابعة
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        alert('اسم المستخدم أو كلمة المرور غير صحيحة');
      }
    }

    // تسجيل الدخول عند الضغط على Enter
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('adminPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          adminLogin();
        }
      });

      // تنظيف البيانات القديمة عند تحميل الصفحة
      const adminLoginStatus = localStorage.getItem('adminLoggedIn');
      const adminUser = localStorage.getItem('adminUser');
      
      // فحص إذا كان المدير مسجل دخول بالفعل
      if (adminLoginStatus === 'true' && adminUser) {
        try {
          const userData = JSON.parse(adminUser);
          // توجيه مباشر للوحة المتابعة
          window.location.href = 'dashboard.html';
        } catch (error) {
          // مسح البيانات التالفة
          localStorage.clear();
        }
      }
    });
  </script>
